services:
  database:
    image: mysql:8.0
    container_name: mapa_marciano_db
    restart: unless-stopped
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      # Permite sobreescribir el puerto del host vía variable de entorno DB_PORT en .env
      # Si el usuario ya tiene un MySQL local en el puerto 3306, puede definir DB_PORT=3307
      - "${DB_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root_password}
      MYSQL_DATABASE: ${DB_NAME:-mapa_marciano}
      TZ: "UTC"
    volumes:
      # Persistencia de datos del motor MySQL
      - mysql_data:/var/lib/mysql
      # Script inicial de migración automática ejecutado solo la primera vez que se crea el volumen
      - ./database:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-root_password}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  mysql_data:
    name: mapa_marciano_mysql_data
